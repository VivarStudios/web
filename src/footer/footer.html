<footer class="footer flex flex-col sm:flex-row sm:footer-horizontal bg-base-200 text-base-content p-10">
    <nav class="order-2 sm:order-1 sm:w-1/2 w-full sm:max-w-screen-sm mx-auto">
        <h6 class="footer-title">Redes Sociales</h6>
        <a class="link link-hover" href="https://www.instagram.com/vivarstudios/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a class="link link-hover" href="https://www.youtube.com/@VivarStudiosChanel" target="_blank" rel="noopener noreferrer">YouTube</a>
    </nav>

    <form id="contactForm" method="POST" class="w-full order-1 sm:order-2 sm:w-1/2 ">

        <h6 class="footer-title">Contacto</h6>

        <!-- Nombre -->
        <fieldset class="fieldset w-full sm:max-w-screen-sm">
            <legend class="fieldset-legend">
                <svg class="h-[1em] opacity-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </g>
                </svg>
                Nombre *
            </legend>
            <input id="name" type="text" class="input validator w-full" required placeholder="Nombre"
                pattern="[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ0-9 \-]*" minlength="3" maxlength="30"
                title="Solo letras, números, guiones, espacios y acentos" />
            <p class="validator-hint hidden">
                entre 3 y 30 caracteres
                <br />sólo se admiten letras, números, guiones, espacios y acentos
            </p>
        </fieldset>

        <!-- Email -->
        <fieldset class="fieldset w-full sm:max-w-screen-sm">
            <legend class="fieldset-legend">
                <svg class="h-[1em] opacity-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </g>
                </svg>
                Email *
            </legend>
            <input id="email" type="email" class="input validator w-full" placeholder="Email" required />
            <p class="validator-hint hidden">Introduzca un email válido</p>
        </fieldset>

        <fieldset class="fieldset w-full sm:max-w-screen-sm">
            <legend class="fieldset-legend">¿Qué necesitas?</legend>
            <textarea id="message" name="message" class="textarea h-24 input validator w-full" placeholder="¿Qué necesitas?"
                minlength="5" maxlength="1000" required></textarea>
            <div class="text-right text-xs opacity-70 mt-2">
                <span id="messageCount">0</span> / <span id="messageMax">1000</span>
            </div>
            <p class="validator-hint hidden">Este campo es obligatorio entre 5 y 1000 caracteres</p>
        </fieldset>

        <div class="flex items-center gap-2 mt-4 w-full sm:max-w-screen-sm">
            <button class="btn btn-ghost" type="reset">Reset</button>
            <button class="btn btn-primary flex-1" type="submit">Enviar</button>
        </div>
    </form>
</footer>
