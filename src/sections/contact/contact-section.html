<div class="flex flex-col grow w-full p-10 max-w-2xl justify-center">
    <form id="contactForm" method="POST" class="flex flex-col w-full items-center order-1">

        <h1 class="relative z-10  text-4xl lg:text-5xl">Contacto</h1>

        <!-- Nombre -->
        <fieldset class="fieldset w-full">
            <legend class="fieldset-legend">
                <svg class="h-[1em] opacity-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </g>
                </svg>
                Nombre *
            </legend>
            <input id="name" name="name" type="text" class="input validator w-full" required placeholder="Nombre"
                pattern="[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ0-9 \-]*" minlength="3" maxlength="30"
                title="Solo letras, números, guiones, espacios y acentos" />
            <p class="validator-hint hidden">
                entre 3 y 30 caracteres
                <br />sólo se admiten letras, números, guiones, espacios y acentos
            </p>
        </fieldset>

        <!-- Email -->
        <fieldset class="fieldset w-full">
            <legend class="fieldset-legend">
                <svg class="h-[1em] opacity-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </g>
                </svg>
                Email *
            </legend>
            <input id="email" name="email" type="email" class="input validator w-full" placeholder="Email" required />
            <p class="validator-hint hidden">Introduzca un email válido</p>
        </fieldset>

        <fieldset class="fieldset w-full">
            <legend class="fieldset-legend">¿Qué necesitas?</legend>
            <textarea id="message" name="message" class="textarea h-24 input validator w-full" placeholder="¿Qué necesitas?"
                minlength="5" maxlength="1000" required></textarea>
            <div class="text-right text-xs opacity-70 mt-2">
                <span id="messageCount">0</span> / <span id="messageMax">1000</span>
            </div>
            <p class="validator-hint hidden">Este campo es obligatorio entre 5 y 1000 caracteres</p>
        </fieldset>

        <div class="flex items-center gap-2 mt-4 w-full">
            <button class="btn btn-ghost" type="reset">Reset</button>
            <button class="btn btn-primary flex-1" type="submit">Enviar</button>
        </div>
    </form>
</div>

<dialog id="contact-modalLoading" class="modal">
  <div class="modal-box flex flex-wrap items-center justify-center">
    <span class="loading loading-ring loading-xl"></span>
    <p>Enviando...</p>
  </div>
</dialog>

<dialog id="contact-modalSuccess" class="modal">
  <div class="modal-box p-0">
    <div role="alert" class="alert alert-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Enviado!</span>
    </div>
  </div>
</dialog>

<dialog id="contact-modalError" class="modal">
  <div class="modal-box p-0">
    <div role="alert" class="alert alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Error!, no enviado.</span>
    </div>
  </div>
</dialog>
